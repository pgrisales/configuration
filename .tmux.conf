# ==========================================
# 1. PERFORMANCE & CORE SETTINGS
# ==========================================
# Remove ESC key delay (vital for Vim/Neovim responsiveness)
set -s escape-time 0

# Increase scrollback history limit
set -g history-limit 50000

# Enable 24-bit true color and focus events
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on

# Enable mouse support
set -g mouse on

# System clipboard integration
set -g set-clipboard on

# ==========================================
# 2. KEYBINDINGS & PRODUCTIVITY
# ==========================================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes visually in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast pane resizing (Hold Prefix + Shift + Direction)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation with Alt + Left/Right (no prefix needed)
bind -n M-Left previous-window
bind -n M-Right next-window

# Start window/pane indexing at 1 & auto-renumber on close
set -g base-index 1
set -g pane-base-index 1
set-window-option -g renumber-windows on

# Vim-style text selection in Copy Mode (Prefix + [ to enter)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# 3. VISUALS & STATUS LINE
# ==========================================
# Minimal transparent status bar
set -g status-position bottom
set -g status-style bg=default,fg=colour245
set -g status-left-length 40
set -g status-left "#[fg=colour39,bold]#S #[fg=colour238]| "
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour39]%H:%M"

# Active vs inactive window tab highlights
setw -g window-status-current-style fg=colour39,bold,bg=default
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-format " #[fg=colour242]#I:#W "

# High-contrast active pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

